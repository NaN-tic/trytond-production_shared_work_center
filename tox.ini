[tox]
envlist = py312-sqlite, stats

[testenv]
basepython=python3.12
commands = coverage run setup.py test
deps =
    sqlite: sqlitebck
    coverage
setenv =
    sqlite: TRYTOND_DATABASE_URI={env:SQLITE_URI:sqlite://}
    sqlite: DB_NAME={env:SQLITE_NAME::memory:}

[testenv:stats]
basepython=python3.12
commands =
    coverage report --omit=.tox/*
    coverage xml
